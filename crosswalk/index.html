<body>
<div class="container">
  <h1 class="mb-4">Statistical &amp; Modeling Terminology Cross‑walk</h1>

  <!-- FILTERS ------------------------------------------------------- -->
  <div class="row g-3 mb-4">
    <div class="col-md-4"><input id="searchTerm" class="form-control"
           placeholder="Search term…"></div>
    <div class="col-md-3">
      <select id="filterField" class="form-select">
        <option value="All">All Fields</option>
        <option value="Health_Science">Health Science</option>
        <option value="Computer_Science">Computer Science</option>
        <option value="Economics">Economics</option>
      </select>
    </div>
    <div class="col-md-3">
      <select id="filterCategory" class="form-select">
        <option value="All">All Categories</option>
        <option value="Category">Category</option>
        <option value="Field">Field</option>
      </select>
    </div>
    <div class="col-md-2"><button id="clearFilters"
           class="btn btn-outline-secondary w-100">Clear</button></div>
  </div>

  <ul class="nav nav-tabs" id="vizTabs" role="tablist">
    <li class="nav-item"><button class="nav-link active"
        data-bs-toggle="tab" data-bs-target="#panel-table">Table view</button></li>
    <li class="nav-item"><button class="nav-link"
        data-bs-toggle="tab" data-bs-target="#panel-sankey">Sankey diagram</button></li>
  </ul>

  <div class="tab-content mt-3">
    <div class="tab-pane fade show active" id="panel-table">
      <div class="table-responsive">
        <table id="crosswalkTable" class="table table-striped table-hover">
          <thead class="table-primary"><tr>
            <th>Term</th><th>Field</th><th>Related Term</th>
            <th>Related Field</th><th>Category</th>
            <th class="def-col">Definition / Description</th>          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="tab-pane fade" id="panel-sankey">
      <div id="sankeyViz" style="width:100%;height:600px;"></div>
    </div>
  </div>
</div>

<script>
const JSON_URL = "resources/crosswalk.json";   
let rawData = [], dt;

function loadData(){
  fetch(JSON_URL).then(r=>{if(!r.ok)throw new Error();return r.json();})
    .then(d=>{rawData=d;populateTable(d);drawSankey(d);})
    .catch(e=>{console.error(e);alert("Failed to load data");});
}
function populateTable(data){
  const $tbody = $("#crosswalkTable tbody"); $tbody.empty();
  data.forEach(r=>{
    const $tr=$("<tr>");
    $tr.append($("<td>").text(r.Term));
    $tr.append($("<td>").html(`<span class="badge field-${r.Field.toLowerCase()}">${r.Field}</span>`));
    $tr.append($("<td>").text(r.Related_Term));
    $tr.append($("<td>").html(`<span class="badge field-${r.Related_Field.toLowerCase()}">${r.Related_Field}</span>`));
    $tr.append($("<td>").html(`<span class="cat-category-${r.Category.toLowerCase().replace(/\s+/g,'-')}">${r.Category}</span>`));
    $tr.append($("<td>").text(r.Definition));

      $tbody.append($tr);
  });
  if($.fn.DataTable.isDataTable("#crosswalkTable")) dt.clear().destroy();
  dt = $("#crosswalkTable").DataTable({paging:true,lengthMenu:[10,25,50,100],order:[[0,'asc']],language:{search:"Global search:",emptyTable:"No records"}});
}
/* --------------------------------------------------------------- */
/*  DRAW THE SANKEY – PURE VEGA (works with vega‑embed@6)         */
/* --------------------------------------------------------------- */
// Simple network table view for term relationships
function drawSankey(data) {
  const el = document.getElementById('sankeyViz');
  
  // Create a simple HTML table showing relationships
  let html = `<div style="padding: 20px;">
    <p style="color: #666; margin-bottom: 20px;"><strong>Term Relationships Network</strong> — This table shows how terms from different fields relate to each other.</p>
    <div style="max-height: 700px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px;">
      <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
        <thead style="background: #f5f5f5; position: sticky; top: 0;">
          <tr>
            <th style="padding: 10px; text-align: left; border-bottom: 2px solid #ddd;">Term</th>
            <th style="padding: 10px; text-align: left; border-bottom: 2px solid #ddd;">Field</th>
            <th style="padding: 10px; text-align: left; border-bottom: 2px solid #ddd;">Related Term</th>
            <th style="padding: 10px; text-align: left; border-bottom: 2px solid #ddd;">Related Field</th>
            <th style="padding: 10px; text-align: left; border-bottom: 2px solid #ddd;">Category</th>
          </tr>
        </thead>
        <tbody>`;
  
  data.forEach(r => {
    const category = r.Category || '';
    
    html += `<tr style="border-bottom: 1px solid #eee;">
      <td style="padding: 10px;"><strong>${r.Term || ''}</strong></td>
      <td style="padding: 10px;"><span style="background: #e3f2fd; color: #1976d2; padding: 4px 8px; border-radius: 3px; font-size: 12px;">${r.Field || ''}</span></td>
      <td style="padding: 10px;"><strong>${r.Related_Term || ''}</strong></td>
      <td style="padding: 10px;"><span style="background: #e3f2fd; color: #1976d2; padding: 4px 8px; border-radius: 3px; font-size: 12px;">${r.Related_Field || ''}</span></td>
      <td style="padding: 10px;"><span style="background: #e3f2fd; color: #000; padding: 4px 8px; border-radius: 3px; font-size: 12px;">${category}</span></td>
    </tr>`;
  });
  
  html += `</tbody></table></div></div>`;
  el.innerHTML = html;
}

function applyFilters(){
  const searchTerm = $("#searchTerm").val().toLowerCase();
  const filterField = $("#filterField").val();
  const filterCategory = $("#filterCategory").val();
  
  if($.fn.DataTable.isDataTable("#crosswalkTable")) {
    dt.column(0).search(searchTerm ? `^${searchTerm}` : '', true, false);
    
    if(filterField === "All" && filterCategory === "All"){
      dt.column(1).search('');
      dt.column(4).search('');
    } else if(filterField === "All"){
      dt.column(4).search(`^${filterCategory}$`, true, false);
      dt.column(1).search('');
    } else if(filterCategory === "All"){
      dt.column(1).search(filterField);
      dt.column(4).search('');
    } else {
      dt.column(1).search(filterField);
      dt.column(4).search(`^${filterCategory}$`, true, false);
    }
    dt.draw();
  }
}

$(function(){
  loadData();
  $("#searchTerm").on("input",applyFilters);
  $("#filterField,#filterCategory").on("change",applyFilters);
  $("#clearFilters").on("click",()=>{$("#searchTerm").val("");$("#filterField").val("All");$("#filterCategory").val("All");applyFilters();});
});
</script>
</body>
